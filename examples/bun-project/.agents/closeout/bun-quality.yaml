specVersion: "0.1"

description: Requires Bun. typecheck runs the typecheck script. tests runs bun test.

items:
  - id: typecheck
    kind: command
    gate: beforePR
    exec: ["bun", "run", "typecheck"]
    timeoutSeconds: 120

  - id: tests
    kind: command
    gate: beforePR
    exec: ["bun", "test"]
    timeoutSeconds: 120
