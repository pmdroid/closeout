[package]
name = "closeout"
version = "0.1.0"
edition = "2024"
description = "Reference runner for the Closeout specification, draft 0.1"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.58.3", default-features = false }
saphyr-parser = "0.1.0"
pgp = "0.20"
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
smallvec = "1.15"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
